<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>💼 Job Application Tracker</h1>

    <!-- Dashboard -->
    <div id="dashboard"></div>

    <!-- Add / Update Form -->
    <div class="section">

        <h2>Add Application</h2>

        <input type="hidden" id="applicationId">

        <div class="form-row">
            <label>Company</label>
            <input
                type="text"
                id="company"
                placeholder="Google"
                required>
        </div>

        <div class="form-row">
            <label>Role</label>
            <input
                type="text"
                id="role"
                placeholder="Python Developer"
                required>
        </div>

        <div class="form-row">
            <label>Location</label>
            <input
                type="text"
                id="location"
                placeholder="Bangalore"
                required>
        </div>

        <div class="form-row">
            <label>Status</label>

            <select id="status">

                <option>Applied</option>
                <option>Interview</option>
                <option>Selected</option>
                <option>Rejected</option>

            </select>

        </div>

        <div class="form-row">
            <label>Applied Date</label>
            <input
                type="date"
                id="appliedDate"
                required>
        </div>

        <div class="form-row">
            <label>Deadline Date</label>
            <input
                type="date"
                id="deadlineDate">
        </div>

        <div class="form-row">
            <label>Interview Date</label>
            <input
                type="date"
                id="interviewDate">
        </div>

        <div class="form-row">
            <label>Notes</label>

            <textarea
                id="notes"
                rows="4"
                placeholder="Interview preparation, HR remarks, follow-up notes..."></textarea>

        </div>

        <button
            id="saveBtn"
            onclick="addApplication()">

            Add Application

        </button>

    </div>

    <!-- Search -->

    <div class="section">

        <h2>Search</h2>

        <input
            type="text"
            id="search"
            placeholder="Search company..."
            onkeyup="searchApplication()">

    </div>

    <!-- Filter + Sort -->

    <div class="section">

        <div class="form-row">

            <label>Status</label>

            <select
                id="filter"
                onchange="filterApplications()">

                <option value="All">All</option>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Selected">Selected</option>
                <option value="Rejected">Rejected</option>

            </select>

        </div>

        <div class="form-row">

            <label>Sort</label>

            <select
                id="sort"
                onchange="sortApplications()">

                <option value="">Select</option>

                <option value="companyaz">
                    Company A-Z
                </option>

                <option value="companyza">
                    Company Z-A
                </option>

                <option value="status">
                    Status
                </option>

                <option value="applied">
                    Applied Date
                </option>

            </select>

        </div>

    </div>

    <!-- Applications -->

    <div class="section">

        <h2>Applications</h2>

        <div id="result"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
