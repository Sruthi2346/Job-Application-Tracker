<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div style="display:flex;justify-content:space-between;align-items:center;">

        <h1>💼 Job Application Tracker</h1>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <!-- Dashboard -->

    <div id="dashboard"></div>

    <!-- Add / Update Form -->

    <div class="section">

        <h2>Add Application</h2>

        <input type="hidden" id="applicationId">

        <div class="form-row">

            <label>Company</label>

            <input
                type="text"
                id="company"
                placeholder="Google">

        </div>

        <div class="form-row">

            <label>Role</label>

            <input
                type="text"
                id="role"
                placeholder="Python Developer">

        </div>

        <div class="form-row">

            <label>Location</label>

            <input
                type="text"
                id="location"
                placeholder="Bangalore">

        </div>

        <div class="form-row">

            <label>Status</label>

            <select id="status">

                <option>Applied</option>
                <option>Interview</option>
                <option>Selected</option>
                <option>Rejected</option>

            </select>

        </div>

        <div class="form-row">

            <label>Applied Date</label>

            <input
                type="date"
                id="applied_date">

        </div>

        <div class="form-row">

            <label>Deadline Date</label>

            <input
                type="date"
                id="deadline_date">

        </div>

        <div class="form-row">

            <label>Interview Date</label>

            <input
                type="date"
                id="interview_date">

        </div>

        <div class="form-row">

            <label>Notes</label>

            <textarea
                id="notes"
                rows="3"
                placeholder="Write notes..."></textarea>

        </div>

        <button
            id="saveBtn"
            onclick="addApplication()">

            Add Application

        </button>

    </div>

    <!-- Search -->

    <div class="section">

        <h2>Search</h2>

        <input
            type="text"
            id="search"
            placeholder="Search company..."
            onkeyup="searchApplication()">

    </div>

    <!-- Filter -->

    <div class="section">

        <div class="form-row">

            <label>Status</label>

            <select
                id="filter"
                onchange="filterApplications()">

                <option value="All">All</option>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Selected">Selected</option>
                <option value="Rejected">Rejected</option>

            </select>

        </div>

    </div>

    <!-- Table -->

    <div class="section">

        <h2>Applications</h2>

        <div id="result"></div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
