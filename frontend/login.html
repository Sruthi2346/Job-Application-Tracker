<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🔐 Login</h1>

    <div class="section">

        <div class="form-row">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email">

        </div>

        <div class="form-row">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password">

        </div>

        <button onclick="loginUser()">

            Login

        </button>

        <br><br>

        <p>

            Don't have an account?

            <a href="register.html">

                Register Here

            </a>

        </p>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
